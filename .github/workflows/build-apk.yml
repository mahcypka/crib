name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Собрать отладочный APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Показать ошибки компиляции
        if: failure()
        run: |
          echo "===== ОШИБКИ КОМПИЛЯЦИИ (начало) ====="
          grep -E "^e: |error:|Compilation error" build.log | head -60 || echo "не найдено"
          echo "===== ОШИБКИ КОМПИЛЯЦИИ (конец) ====="

      - name: Приложить APK к сборке
        uses: actions/upload-artifact@v4
        with:
          name: cribbage-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
